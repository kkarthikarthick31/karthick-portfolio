    // --- HERO 3D SCENE COMPONENT ---
    function Hero3D() {
      const containerRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        // Core Octahedron
        const coreGeo = new THREE.OctahedronGeometry(1.3, 0);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x0a2540, roughness: 0.2, metalness: 0.8 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        group.add(core);

        // Wireframe
        const wireGeo = new THREE.OctahedronGeometry(1.35, 1);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true, transparent: true, opacity: 0.6 });
        const wire = new THREE.Mesh(wireGeo, wireMat);
        group.add(wire);

        // Gimbal Rings
        const ring1Geo = new THREE.TorusGeometry(2.1, 0.03, 16, 100);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        ring1.rotation.x = Math.PI / 3;
        group.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(2.4, 0.03, 16, 100);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xa855f7 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.y = Math.PI / 4;
        group.add(ring2);

        // Floating Cubes
        const cubes = [];
        const cubeGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
        const cubeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        for (let i = 0; i < 16; i++) {
          const c = new THREE.Mesh(cubeGeo, cubeMat);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(Math.random() * 2 - 1);
          const r = 2.2 + Math.random() * 0.5;
          c.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
          group.add(c);
          cubes.push(c);
        }

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const point1 = new THREE.PointLight(0x00f2fe, 3, 20);
        point1.position.set(4, 3, 4);
        scene.add(point1);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          group.rotation.y += 0.005;
          group.rotation.x += 0.002;
          ring1.rotation.z += 0.008;
          ring2.rotation.z -= 0.006;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []);

      return <div ref={containerRef} className="w-full h-80 sm:h-96 lg:h-[460px]" />;
    }

            </div>
            <div className="flex flex-wrap justify-center gap-2 mb-10">
              {Object.keys(DATA.skills).map(k => (
                <button
                  key={k}
                  onClick={() => setSkillCategory(k)}
                  className={`px-4 py-2 rounded-xl text-xs font-mono uppercase font-semibold transition-all ${
                    skillCategory === k ? 'bg-dark-800 border border-cyber-cyan text-white shadow-glow-cyan' : 'bg-dark-900 border border-slate-800 text-slate-400 hover:text-white'
                  }`}
                >
                  {k}
                </button>
              ))}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {DATA.skills[skillCategory].map(s => (
                <div key={s.name} className="glass-card p-6 rounded-2xl border border-slate-800 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-3">
                      <span className="text-base font-bold text-white font-display">{s.name}</span>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-dark-850 text-cyber-cyan border border-slate-800">{s.level}</span>
                    </div>
                    <p className="text-xs text-slate-400 leading-relaxed">{s.desc}</p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-slate-800 text-[10px] font-mono text-slate-500">RESUME VERIFIED</div>
                </div>
              ))}
            </div>
          </section>

          {/* Experience Section */}
          <section id="experience" className="py-24 max-w-5xl mx-auto px-4 sm:px-6">
            <div className="text-center max-w-2xl mx-auto mb-16">
              <span className="text-xs font-mono text-cyber-cyan uppercase tracking-widest">// 03. CAREER TIMELINE</span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-white mt-2">Professional <span className="text-gradient-cyber">Experience</span></h2>
            </div>
            <div className="space-y-8">
              {DATA.experience.map(exp => (
                <div key={exp.id} className="glass-card p-8 rounded-2xl border border-slate-800">
                  <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-3">
                    <div>
                      <h3 className="text-xl sm:text-2xl font-bold text-white font-display">{exp.role}</h3>
                      <div className="text-sm font-semibold text-cyber-blue">{exp.company} • {exp.location}</div>
                    </div>
                    <span className="text-xs font-mono text-cyber-cyan px-3 py-1 rounded-full bg-slate-900 border border-slate-800 w-fit">{exp.period}</span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-4">{exp.description}</p>
                  <ul className="space-y-1.5 mb-6 text-xs text-slate-400">
                    {exp.responsibilities.map((r, i) => (
                      <li key={i} className="flex items-start gap-2">
                        <span className="text-cyber-cyan">▹</span>
                        <span>{r}</span>
                      </li>
                    ))}
                  </ul>
                  <div className="flex flex-wrap gap-2 pt-4 border-t border-slate-800">
                    {exp.stack.map(st => (
                      <span key={st} className="px-2.5 py-1 rounded bg-dark-850 border border-slate-800 text-[11px] font-mono text-slate-300">
                        {st}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Projects Section */}
          <section id="projects" className="py-24 max-w-7xl mx-auto px-4 sm:px-6">
            <div className="text-center max-w-2xl mx-auto mb-16">
              <span className="text-xs font-mono text-cyber-cyan uppercase tracking-widest">// 04. FEATURED WORK</span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-white mt-2">Featured <span className="text-gradient-cyber">Projects</span></h2>
            </div>
            <div className="space-y-12">
              {/* Project 1 */}
              <div className="glass-card p-8 sm:p-10 rounded-3xl border border-slate-800">
                <span className="text-xs font-mono text-cyber-cyan uppercase tracking-wider">// FULL STACK CRUD APP</span>
                <h3 className="text-2xl sm:text-3xl font-extrabold text-white font-display mt-1 mb-2">Inventory Management System</h3>
                <p className="text-xs sm:text-sm text-slate-300 max-w-3xl leading-relaxed mb-6">
                  Full-stack application for product management, stock tracking, and CRUD operations built with Java, Spring Boot, ReactJS, and MySQL. Tested using Postman and managed with Git version control.
                </p>
                <div className="flex flex-wrap gap-2 mb-6">
                  {["Java", "Spring Boot", "ReactJS", "MySQL", "REST APIs", "Git"].map(t => (
                    <span key={t} className="px-3 py-1.5 rounded-lg bg-dark-850 border border-slate-800 text-xs font-mono text-slate-200">{t}</span>
                  ))}
                </div>
                <div className="flex gap-4">
                  <a href={DATA.github} target="_blank" className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-mono text-white">GitHub Repo</a>
                </div>
              </div>

              {/* Project 2 */}
              <div className="glass-card p-8 sm:p-10 rounded-3xl border border-slate-800">
                <span className="text-xs font-mono text-cyber-emerald uppercase tracking-wider">// BLOCKCHAIN DISTRIBUTED LEDGER</span>
                <h3 className="text-2xl sm:text-3xl font-extrabold text-white font-display mt-1 mb-2">Farmer-to-Consumer Food Traceability System</h3>
                <p className="text-xs sm:text-sm text-slate-300 max-w-3xl leading-relaxed mb-6">
                  Blockchain-based system designed to track products transparently from farmers to consumers, ensuring accountability, food safety, and immutable transaction records. Built with Java and MySQL.
                </p>
                <SupplyChainVisualizer />
                <div className="mt-6 flex flex-wrap gap-2">
                  {["Java", "Blockchain", "MySQL", "Verification Workflows"].map(t => (
                    <span key={t} className="px-3 py-1.5 rounded-lg bg-dark-850 border border-slate-800 text-xs font-mono text-slate-200">{t}</span>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* Coding Section */}
          <section id="coding" className="py-24 max-w-5xl mx-auto px-4 sm:px-6">
            <div className="text-center max-w-2xl mx-auto mb-16">
              <span className="text-xs font-mono text-amber-400 uppercase tracking-widest">// 05. PROBLEM SOLVING</span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-white mt-2">Code & <span className="text-gradient-cyber">Problem Solving</span></h2>
            </div>
            <div className="glass-card p-8 rounded-3xl border border-slate-800">
              <div className="flex justify-between items-center mb-6">
                <div>
                  <h3 className="text-2xl font-bold text-white font-display">LeetCode Top SQL 50</h3>
                  <p className="text-xs font-mono text-slate-400 mt-1">Verified problem-solving proficiency across relational database querying</p>
                </div>
                <span className="px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 text-xs font-mono font-bold">Top SQL 50</span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                {["Joins", "Subqueries", "Window Functions", "Aggregation", "Ranking", "CTEs", "Query Optimization"].map(topic => (
                  <div key={topic} className="p-3 rounded-xl bg-dark-850 border border-slate-800 text-xs font-mono text-slate-300">
                    <span className="text-amber-400 mr-1.5">✓</span>
                    {topic}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Achievements Section */}
          <section id="achievements" className="py-24 max-w-5xl mx-auto px-4 sm:px-6">
            <div className="text-center max-w-2xl mx-auto mb-16">
              <span className="text-xs font-mono text-cyber-cyan uppercase tracking-widest">// 06. CREDENTIALS</span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-white mt-2">Certifications & <span className="text-gradient-cyber">Achievements</span></h2>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
              {DATA.achievements.map(ach => (
                <div key={ach.title} className="glass-card p-6 rounded-2xl border border-slate-800 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-start mb-2">
                      <h3 className="font-bold text-white text-lg font-display">{ach.title}</h3>
                      <span className="px-2.5 py-0.5 rounded bg-slate-850 text-cyber-cyan text-xs font-mono">{ach.badge}</span>
                    </div>
                    <div className="text-xs font-mono text-slate-500 mb-3">{ach.org}</div>
                    <p className="text-xs text-slate-300 leading-relaxed">{ach.desc}</p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-slate-800 text-[10px] font-mono text-slate-500">AUTHENTICATED CREDENTIAL</div>
                </div>
              ))}
            </div>
          </section>

          {/* Contact Section */}
          <section id="contact" className="py-24 max-w-5xl mx-auto px-4 sm:px-6">
            <div className="text-center max-w-2xl mx-auto mb-16">
              <span className="text-xs font-mono text-cyber-cyan uppercase tracking-widest">// 07. GET IN TOUCH</span>
              <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-white mt-2">Let's Build <span className="text-gradient-cyber">Something Together</span></h2>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-5 flex flex-col justify-between">
                <div>
                  <h3 className="text-xl font-bold text-white font-display mb-3">Available for Full Stack Roles</h3>
                  <p className="text-xs sm:text-sm text-slate-400 leading-relaxed mb-6">
                    Open to entry-level Java Full Stack Developer opportunities. Feel free to send a message or contact me directly via email.
                  </p>
                  <div className="p-4 rounded-xl bg-dark-850 border border-slate-800 mb-6">
                    <div className="text-[10px] font-mono text-slate-500 uppercase">Direct Email</div>
                    <a href={`mailto:${DATA.email}`} className="text-sm font-semibold text-white hover:text-cyber-cyan">{DATA.email}</a>
                  </div>
                  <div className="space-y-2 text-xs font-mono text-slate-400">
                    <div>GitHub: <a href={DATA.github} target="_blank" className="text-cyber-cyan">github.com/kkarthikarthick31</a></div>
                    <div>LinkedIn: <a href={DATA.linkedin} target="_blank" className="text-cyber-cyan">linkedin.com/in/kkarthi2004</a></div>
                  </div>
                </div>
              </div>
              <div className="lg:col-span-7">
                <form onSubmit={handleContactSubmit} className="glass-panel p-8 rounded-3xl border border-slate-800 space-y-4">
                  {emailStatus && (
                    <div className="p-3 rounded-lg bg-cyber-emerald/15 border border-cyber-emerald/30 text-xs font-mono text-cyber-emerald">
                      {emailStatus}
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">Your Name *</label>
                    <input name="name" required placeholder="Alex Morgan" className="w-full px-4 py-3 rounded-xl bg-dark-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyber-cyan" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">Your Email *</label>
                    <input name="email" type="email" required placeholder="alex@company.com" className="w-full px-4 py-3 rounded-xl bg-dark-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyber-cyan" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">Subject</label>
                    <input name="subject" placeholder="Developer Role / Inquiry" className="w-full px-4 py-3 rounded-xl bg-dark-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyber-cyan" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">Message *</label>
                    <textarea name="message" required rows="4" placeholder="Let's build together..." className="w-full px-4 py-3 rounded-xl bg-dark-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyber-cyan resize-none"></textarea>
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyber-cyan to-cyber-blue text-dark-950 font-bold text-xs shadow-glow-cyan hover:brightness-110">
                    Send Message
                  </button>
                </form>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="py-12 border-t border-slate-800 text-center text-xs font-mono text-slate-500">
            <div>© 2026 {DATA.name}. Java Full Stack Developer • All rights reserved.</div>
          </footer>

          {/* Resume Modal */}
          {isResumeOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark-950/80 backdrop-blur-md">
              <div className="relative w-full max-w-3xl max-h-[90vh] bg-dark-900 border border-slate-700 rounded-2xl p-6 sm:p-8 overflow-y-auto">
                <div className="flex justify-between items-center pb-4 mb-6 border-b border-slate-800">
                  <h3 className="text-xl font-bold text-white font-display">Resume: {DATA.name}</h3>
                  <div className="flex items-center gap-2">
                    <button onClick={() => window.print()} className="px-3 py-1.5 rounded-lg bg-cyber-cyan text-dark-950 text-xs font-bold">Print / Save PDF</button>
                    <button onClick={() => setIsResumeOpen(false)} className="text-slate-400 hover:text-white px-2 text-base">✕</button>
                  </div>
                </div>
                <div className="space-y-6 text-xs text-slate-300">
                  <div>
                    <h4 className="text-white font-bold text-base">{DATA.name}</h4>
                    <p className="text-cyber-cyan">{DATA.title} • {DATA.location}</p>
                    <p className="mt-1 text-slate-400">Email: {DATA.email} | GitHub: github.com/kkarthikarthick31 | LinkedIn: linkedin.com/in/kkarthi2004</p>
                  </div>
                  <div>
                    <div className="text-cyber-cyan font-bold uppercase mb-1">// Education</div>
                    <p className="text-white font-semibold">Master of Computer Applications (MCA) — 80% Aggregate</p>
                  </div>
                  <div>
                    <div className="text-cyber-cyan font-bold uppercase mb-1">// Experience</div>
                    {DATA.experience.map(exp => (
                      <div key={exp.id} className="mb-3">
                        <div className="text-white font-semibold">{exp.role} — {exp.company} ({exp.period})</div>
                        <p className="text-slate-400 mt-0.5">{exp.description}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
